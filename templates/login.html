<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa; /* Fundo cinza claro */
            font-family: 'Inter', sans-serif; /* Fonte moderna */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Garante que o corpo ocupe 100% da altura da viewport */
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px; /* Largura máxima do formulário de login */
            border-radius: 0.75rem; /* Cantos arredondados */
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1); /* Sombra suave */
            padding: 2.5rem; /* Espaçamento interno */
        }
        .login-title {
            color: #007bff; /* Cor do título */
            font-weight: bold;
            margin-bottom: 1.5rem; /* Ajustado para dar espaço ao logo */
        }
        .form-control {
            border-radius: 0.5rem; /* Cantos arredondados para campos de input */
            padding: 0.75rem 1rem;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            border-radius: 0.5rem; /* Cantos arredondados para o botão */
            padding: 0.75rem 1.5rem;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
        .alert {
            border-radius: 0.5rem;
            margin-bottom: 1.5rem; /* Espaçamento abaixo do alerta */
        }
        /* Estilo para o logo */
        .login-logo {
            max-width: 180px; /* Tamanho máximo do logo */
            height: auto;
            display: block; /* Para centralizar com margin: auto */
            margin: 0 auto 1.5rem auto; /* Centraliza e adiciona margem inferior */
        }
    </style>
    <script>
        // Script para fazer as mensagens flash desaparecerem automaticamente
        setTimeout(function () {
            $(".alert").fadeOut("slow");
        }, 5000);
    </script>
</head>
<body>
    <div class="card login-card text-center">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Elétrica Bahiana" class="login-logo">

        <h2 class="login-title">Login</h2>

        {# Exibe mensagens flash #}
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post">
            <div class="form-group">
                <input type="text" name="matricula" class="form-control" placeholder="Matrícula" required autofocus>
            </div>
            <div class="form-group">
                <input type="password" name="senha" class="form-control" placeholder="Senha" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>
        <a class="mt-3 mb-0 text-muted">Esqueceu a senha?</p> {# Adicionado o texto "Esqueceu a senha?" #}
    </div>
</body>
</html>
